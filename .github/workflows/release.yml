name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  container-images:
    name: Container Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # metadata-action emits one tag set per entry in `images:`. Listing
      # both registries here means build-push-action pushes to both in a
      # single buildx run — no extra build time, same multi-arch manifest
      # on each registry.
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager
            docker.io/eenemeene/kitamanager
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager-ui
            docker.io/eenemeene/kitamanager-ui
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Docker metadata (Report)
        id: meta-report
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager-report
            docker.io/eenemeene/kitamanager-report
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          # Same version triple the API + report images bake. Surfaced
          # at runtime by the frontend's GET /version route handler so
          # the report-pdf colophon can include the web version
          # alongside the API and CLI versions.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push Report image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.report
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-report.outputs.tags }}
          labels: ${{ steps.meta-report.outputs.labels }}
          # Same version triple the API image bakes — the report tool
          # carries its own internal/version package, populated by the
          # ldflags in Dockerfile.report and surfaced via `--version`
          # plus the colophon stamp on every generated PDF.
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=report
          cache-to: type=gha,mode=max,scope=report
