name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Required for cosign keyless signing: the workflow exchanges its
  # OIDC token with sigstore's Fulcio CA for a short-lived signing
  # certificate. No long-lived signing key needs to live in secrets.
  # Closes audit finding O-M-1 (security review 2026-05-01).
  id-token: write
  # Required for SLSA provenance attestations. docker/build-push-action
  # with provenance: mode=max writes the attestation to the same
  # registry as the image manifest.
  attestations: write

jobs:
  # Verify the release tag is a signed annotated tag whose signature
  # GitHub considers valid. Container builds — including the cosign
  # signing step — happen on the next job, but cosign signs whatever
  # the release pipeline received: a compromised maintainer account
  # could draft a release on a malicious tag and the rest of the
  # pipeline (build, sign, push to GHCR) would proceed unchallenged.
  # Failing this job before any image is built or pushed means that
  # social-engineered "publish release" path can't produce a
  # downstream-trusted artifact.
  #
  # Lightweight tags don't carry GPG/SSH signatures at all, so we
  # reject those up front. For annotated tags we use the GitHub API's
  # verification.verified field, which is computed against the
  # configured signing keys on the org/account.
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag signature via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ref=$(gh api "repos/${REPO}/git/ref/tags/${TAG_NAME}")
          obj_type=$(jq -r '.object.type' <<<"${ref}")
          obj_sha=$(jq -r '.object.sha' <<<"${ref}")

          if [ "${obj_type}" != "tag" ]; then
            echo "::error::Release tag ${TAG_NAME} is a lightweight tag (${obj_type}); must be an annotated, signed tag (git tag -s)."
            exit 1
          fi

          tag_obj=$(gh api "repos/${REPO}/git/tags/${obj_sha}")
          verified=$(jq -r '.verification.verified' <<<"${tag_obj}")
          reason=$(jq -r '.verification.reason' <<<"${tag_obj}")

          if [ "${verified}" != "true" ]; then
            echo "::error::Release tag ${TAG_NAME} signature is not verified (reason: ${reason})."
            exit 1
          fi

          echo "Release tag ${TAG_NAME} signature verified by GitHub (reason: ${reason})."

  container-images:
    name: Container Images
    runs-on: ubuntu-latest
    needs: verify-tag

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cosign for image signing. Pinned to the v3.7.0 commit SHA so
      # a compromised cosign release cannot inject a malicious signing
      # binary into the workflow.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # metadata-action emits one tag set per entry in `images:`. Listing
      # both registries here means build-push-action pushes to both in a
      # single buildx run — no extra build time, same multi-arch manifest
      # on each registry.
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager
            docker.io/eenemeene/kitamanager
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager-ui
            docker.io/eenemeene/kitamanager-ui
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Docker metadata (Report)
        id: meta-report
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eenemeene/kitamanager-report
            docker.io/eenemeene/kitamanager-report
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          # Closes audit finding O-M-1: SBOM + SLSA provenance attestations
          # are written alongside the manifest in both registries.
          # mode=max emits the full build graph (every layer, every
          # build-arg) so downstream consumers can verify exactly what
          # the binary was compiled from.
          provenance: mode=max
          sbom: true

      - name: Build and push Frontend image
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          # Same version triple the API + report images bake. Surfaced
          # at runtime by the frontend's GET /version route handler so
          # the report-pdf colophon can include the web version
          # alongside the API and CLI versions.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true

      - name: Build and push Report image
        id: build-report
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.report
          push: true
          # amd64 only — the report image bundles Playwright + Chromium
          # (~200 MB) installed via `npx playwright install chromium`,
          # and running that under QEMU arm64 emulation on an amd64
          # runner reliably exhausts the 6h job timeout. The report
          # tool's deployment targets (cron / systemd / k8s CronJob on
          # ordinary servers) are virtually all amd64 anyway. Apple
          # Silicon developers can `docker build` locally if needed.
          platforms: linux/amd64
          tags: ${{ steps.meta-report.outputs.tags }}
          labels: ${{ steps.meta-report.outputs.labels }}
          # Same version triple the API image bakes — the report tool
          # carries its own internal/version package, populated by the
          # ldflags in Dockerfile.report and surfaced via `--version`
          # plus the colophon stamp on every generated PDF.
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.created_at }}
          cache-from: type=gha,scope=report
          cache-to: type=gha,mode=max,scope=report
          provenance: mode=max
          sbom: true

      # Cosign keyless signing. The OIDC token is exchanged with
      # sigstore's Fulcio for an ephemeral signing certificate; no
      # long-lived signing key lives in repo secrets. Each tag is
      # signed in both registries (GHCR + Docker Hub).
      #
      # Verifying downstream:
      #   cosign verify ghcr.io/eenemeene/kitamanager:<tag> \
      #     --certificate-identity=https://github.com/eenemeene/kitamanager-go/.github/workflows/release.yml@refs/tags/<tag> \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Sign images with cosign
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          REPORT_DIGEST: ${{ steps.build-report.outputs.digest }}
          API_TAGS: ${{ steps.meta-api.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.meta-frontend.outputs.tags }}
          REPORT_TAGS: ${{ steps.meta-report.outputs.tags }}
        run: |
          set -euo pipefail
          # docker/metadata-action emits one tag per line. Sign each
          # one by digest so the signature binds to the exact bytes
          # that were pushed (a future floating-tag mutation cannot
          # invalidate or reuse the signature).
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag%:*}@${API_DIGEST}"
          done <<< "${API_TAGS}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag%:*}@${FRONTEND_DIGEST}"
          done <<< "${FRONTEND_TAGS}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag%:*}@${REPORT_DIGEST}"
          done <<< "${REPORT_TAGS}"
