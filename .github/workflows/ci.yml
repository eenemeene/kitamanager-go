name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.12'
  MIN_COVERAGE: 35
  # Disable the testcontainers Ryuk reaper. The unit suites start one
  # Postgres container per package (internal/testutil); `go test ./...`
  # runs those binaries in parallel, and the Ryuk handshake intermittently
  # fails under that fan-out ("Reaper handshake failed: read ack: EOF"),
  # taking the DB down mid-run ("connection refused" cascades). Ryuk only
  # garbage-collects containers after the run — GitHub runners are
  # ephemeral and discard everything when the job ends, so the reaper buys
  # nothing here while being a flake source. Removing it leaves container
  # startup itself untouched.
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Lint API
        run: make api-lint

      - name: Verify OpenAPI spec is current
        run: make swagger-check

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Verify generated API types are current
        run: make api-types-check

      - name: Lint web
        run: make web-lint

      - name: Check web formatting
        run: make web-format-check

      - name: Type-check web
        run: make web-type-check

  api-test:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run API tests
        run: make api-test-coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below minimum threshold of ${{ env.MIN_COVERAGE }}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  web-test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Run web tests
        run: make web-test-coverage

  api-integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        env:
          TEST_DB_TYPE: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: kitamanager
          TEST_DB_PASSWORD: kitamanager
          TEST_DB_NAME: kitamanager_test
        run: make api-test-integration

  backup-restore:
    name: Backup & Restore Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run backup/restore test
        run: make api-test-backup

  api-fuzz:
    name: API Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run fuzz tests
        run: make api-test-fuzz

  api-build:
    name: API Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build API
        run: make api-build

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Build web
        run: make web-build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... | grep -v internal/testutil)

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: kitamanager-api:${{ github.sha }}
          build-args: |
            GIT_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image is otherwise only built by the release workflow on
      # tag publish, so dependency-resolution issues (e.g. peer-dep
      # conflicts) can't be caught until a release fails. Build it here on
      # every PR so it fails fast in CI instead.
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: kitamanager-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy vulnerability scanner
        # Pinned to the v0.36.0 release SHA. Closes audit finding O-H-1
        # (security review 2026-05-01): every other action in this
        # repo is pinned to a major or SHA; trivy-action was the lone
        # @master outlier, which would import arbitrary code into CI
        # if upstream got compromised. Update by bumping the SHA AND
        # the comment together.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kitamanager-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  api-contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run API contract tests
        env:
          TEST_DB_TYPE: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: kitamanager
          TEST_DB_PASSWORD: kitamanager
          TEST_DB_NAME: kitamanager_test
        run: make api-test-contract

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [api-build, web-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Install Playwright system deps
        run: cd frontend && npx playwright install-deps chromium

      - name: Build web
        run: make web-build

      - name: Build API
        run: make api-build

      - name: Start API server
        run: |
          DB_HOST=localhost \
          DB_PORT=5432 \
          DB_USER=kitamanager \
          DB_PASSWORD=kitamanager \
          DB_NAME=kitamanager \
          DB_SSLMODE=disable \
          CSRF_HMAC_KEY=ci-only-csrf-hmac-key-not-for-production-at-least-32-chars \
          TOTP_ENCRYPTION_KEY=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef \
          WEBAUTHN_RP_ID=localhost \
          WEBAUTHN_RP_NAME="KitaManager CI" \
          WEBAUTHN_ORIGINS="http://localhost:3000" \
          SECURE_COOKIES=false \
          SEED_ADMIN_EMAIL=superadmin@example.com \
          SEED_ADMIN_PASSWORD=supersecret \
          SEED_ADMIN_NAME="Super Admin" \
          SEED_RBAC_POLICIES=true \
          SEED_TEST_DATA=true \
          LOGIN_RATE_LIMIT_PER_MINUTE=0 \
          API_RATE_LIMIT_PER_MINUTE=0 \
          CORS_ALLOW_ORIGINS="http://localhost:3000" \
          CORS_ALLOW_CREDENTIALS=true \
          GOVERNMENT_FUNDING_SEED_PATH=configs/government-fundings/berlin.yaml \
          GOVERNMENT_FUNDING_SEED_STATE=berlin \
          ./bin/kitamanager-api &
          API_PID=$!
          # Wait for API to be ready with retry loop
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process died"
              exit 1
            fi
            # Try the health check
            if curl -sf http://localhost:8080/api/v1/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 1
          done
          echo "API failed to start - checking what's listening on 8080:"
          ss -tlnp | grep 8080 || echo "Nothing on 8080"
          echo "Process status:"
          ps aux | grep kitamanager || echo "No kitamanager process"
          exit 1

      - name: Start Next.js server
        run: |
          cd frontend && npm run build && npm run start &
          # Wait for Next.js to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js is ready"
              break
            fi
            echo "Waiting for Next.js... ($i/30)"
            sleep 1
          done

      - name: Run E2E tests
        run: cd frontend && npx playwright test --project=chromium --shard=${{ matrix.shard }}/2
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

      # Smoke-test the report-pdf tool against the same running stack the
      # E2E suite just exercised: verifies the print pages still render
      # end-to-end (login → cookie wiring → Playwright render → PDF write
      # → pdfcpu merge) and produces an artifact a reviewer can open to
      # eyeball regressions in chart layout that unit tests can't catch.
      # Reuses the seed admin credentials the API already booted with.
      #
      # We exercise the actual Dockerfile.report container — not just the
      # Go binary on the runner — because that's the artefact end users
      # consume, and CI testing only the binary on Ubuntu (which has all
      # of Chromium's shared libs already) hid the v0.29.0 release going
      # out with a wrong-Chromium-revision and a runtime base missing
      # libnss/libatk/etc. Building + running the image here means a
      # broken image fails CI instead of a cut release.
      #
      # Runs even when the E2E suite fails (`!cancelled()` rather than
      # `success()`) — that catches the case where the report renders
      # fine but a different E2E spec is flaky, and surfaces report-only
      # failures that would otherwise be invisible to the E2E job.
      # Run the report-pdf smoke-test only on shard 1 — both shards bring
      # up identical stacks, so generating the PDF on every shard would
      # only duplicate work and create artifact-name collisions.
      - name: Set up Docker Buildx (for report image cache)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: docker/setup-buildx-action@v4

      - name: Build report-pdf image
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.report
          load: true
          tags: kitamanager-report:ci
          cache-from: type=gha,scope=report-ci
          cache-to: type=gha,mode=max,scope=report-ci

      - name: Generate PDF reports (via container)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: |
          mkdir -p /tmp/report-pdfs
          # The non-root `node` user inside the container writes the
          # PDFs; the bind-mounted host dir needs to be world-writable
          # for that to succeed on the GitHub-hosted runner.
          chmod 777 /tmp/report-pdfs
          # --network host so the container can reach the API and
          # frontend running on the runner's localhost.
          docker run --network host --rm \
            -e KITAMANAGER_REPORT_EMAIL=superadmin@example.com \
            -e KITAMANAGER_REPORT_PASSWORD=supersecret \
            -e KITAMANAGER_REPORT_ORG_ID=1 \
            -e KITAMANAGER_REPORT_BASE_URL=http://localhost:3000 \
            -e KITAMANAGER_REPORT_API_URL=http://localhost:8080 \
            -e KITAMANAGER_REPORT_OUTPUT_DIR=/output \
            -v /tmp/report-pdfs:/output \
            kitamanager-report:ci

      - name: Upload generated report
        # Upload only the merged report (`report-{org}-{month}.pdf`) —
        # the four per-section PDFs in the same directory are intermediate
        # artefacts that pdf.MergeFiles already concatenates into the
        # combined file, so shipping them separately is just noise inside
        # the zip wrapper GitHub forces on every artifact.
        # always() (gated on shard 1) so we capture the merged file if it
        # was produced even when an earlier step (e.g., E2E) failed.
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: report-pdf
          path: /tmp/report-pdfs/report-*.pdf
          retention-days: 30
          if-no-files-found: ignore

  swagger-docs:
    name: Swagger Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Generate swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          make swagger-docs

      - name: Check for uncommitted changes
        run: git diff --exit-code docs/

  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: peaceiris/actions-hugo@v3
        with:
          extended: true

      - name: Build website
        run: cd website && hugo --minify
