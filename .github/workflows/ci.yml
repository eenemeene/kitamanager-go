name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26.6'
  # The floor the API suites must clear. Measured coverage is 70.6% and has
  # been for every run sampled, because Go coverage is deterministic for
  # identical code — there is no noise band to leave room for.
  #
  # It sat at 35 for long enough that it stopped meaning anything: coverage
  # could have halved without CI noticing, which is the opposite of what a
  # gate is for. 68 keeps a couple of points of headroom so that adding a
  # modest untested path does not block unrelated work, while deleting a
  # package's tests still trips it.
  #
  # Raise this when coverage rises. Never lower it to make a red build green
  # — that converts the one number protecting the suites into a record of the
  # worst it has ever been.
  MIN_COVERAGE: 68
  # Disable the testcontainers Ryuk reaper. The unit suites start one
  # Postgres container per package (internal/testutil); `go test ./...`
  # runs those binaries in parallel, and the Ryuk handshake intermittently
  # fails under that fan-out ("Reaper handshake failed: read ack: EOF"),
  # taking the DB down mid-run ("connection refused" cascades). Ryuk only
  # garbage-collects containers after the run — GitHub runners are
  # ephemeral and discard everything when the job ends, so the reaper buys
  # nothing here while being a flake source. Removing it leaves container
  # startup itself untouched.
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Lint API
        run: make api-lint

      - name: Verify OpenAPI spec is current
        run: make swagger-check

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Verify generated API types are current
        run: make api-types-check

      - name: Lint web
        run: make web-lint

      - name: Check web formatting
        run: make web-format-check

      - name: Type-check web
        run: make web-type-check

  api-test:
    name: API Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run API tests
        run: make api-test-coverage

      - name: Check coverage threshold
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          # A figure that will not parse has to fail the step. `(( ))` treats an
          # empty string as false, so the previous version passed the gate
          # whenever the measurement itself broke - a missing coverage.out, a
          # changed `go tool cover` format, a `grep total` that matched
          # something else. A gate that goes quiet exactly when it cannot see is
          # worse than no gate, because it still looks green.
          if ! [[ "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "could not read a coverage figure from coverage.out (got: '${COVERAGE}')"
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below minimum threshold of ${{ env.MIN_COVERAGE }}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  web-test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Run web tests
        run: make web-test-coverage

  api-integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        env:
          TEST_DB_TYPE: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: kitamanager
          TEST_DB_PASSWORD: kitamanager
          TEST_DB_NAME: kitamanager_test
        run: make api-test-integration

  backup-restore:
    name: Backup & Restore Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run backup/restore test
        run: make api-test-backup

  api-fuzz:
    name: API Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run fuzz tests
        run: make api-test-fuzz

  api-build:
    name: API Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build API
        run: make api-build

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Build web
        run: make web-build

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... | grep -v internal/testutil)

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: kitamanager-api:${{ github.sha }}
          build-args: |
            GIT_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image is otherwise only built by the release workflow on
      # tag publish, so dependency-resolution issues (e.g. peer-dep
      # conflicts) can't be caught until a release fails. Build it here on
      # every PR so it fails fast in CI instead.
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: kitamanager-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy vulnerability scanner
        # Pinned to the v0.36.0 release SHA. Closes audit finding O-H-1
        # (security review 2026-05-01): every other action in this
        # repo is pinned to a major or SHA; trivy-action was the lone
        # @master outlier, which would import arbitrary code into CI
        # if upstream got compromised. Update by bumping the SHA AND
        # the comment together.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kitamanager-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  api-contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run API contract tests
        env:
          TEST_DB_TYPE: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: kitamanager
          TEST_DB_PASSWORD: kitamanager
          TEST_DB_NAME: kitamanager_test
        run: make api-test-contract

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [api-build, web-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kitamanager
          POSTGRES_PASSWORD: kitamanager
          POSTGRES_DB: kitamanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitamanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium

      - name: Install Playwright system deps
        # 22 seconds on a healthy run, and it has now hung inside apt twice in a
        # day -- three shards on 2026-08-18, three more on 2026-08-19 -- each
        # time with no output at all. The step cap turned a six-hour burn into
        # ten minutes, but a hang here still failed the whole job before a single
        # test ran.
        #
        # The runner image already ships the libraries chromium needs, so this is
        # insurance rather than a requirement. Two bounded attempts, and if apt is
        # still wedged the job carries on: a genuinely missing library then shows
        # up as a browser that will not launch, which is a clear failure in the
        # E2E step rather than an unexplained one here.
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd frontend
          timeout 240 npx playwright install-deps chromium \
            || timeout 240 npx playwright install-deps chromium \
            || echo "playwright install-deps did not complete; continuing on the image's own libraries"

      - name: Build web
        run: make web-build

      - name: Build API
        run: make api-build

      - name: Start API server
        id: api
        run: |
          DB_HOST=localhost \
          DB_PORT=5432 \
          DB_USER=kitamanager \
          DB_PASSWORD=kitamanager \
          DB_NAME=kitamanager \
          DB_SSLMODE=disable \
          CSRF_HMAC_KEY=ci-only-csrf-hmac-key-not-for-production-at-least-32-chars \
          TOTP_ENCRYPTION_KEY=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef \
          WEBAUTHN_RP_ID=localhost \
          WEBAUTHN_RP_NAME="KitaManager CI" \
          WEBAUTHN_ORIGINS="http://localhost:3000" \
          SECURE_COOKIES=false \
          SEED_ADMIN_EMAIL=superadmin@example.com \
          SEED_ADMIN_PASSWORD=supersecret \
          SEED_ADMIN_NAME="Super Admin" \
          SEED_RBAC_POLICIES=true \
          SEED_TEST_DATA=true \
          LOGIN_RATE_LIMIT_PER_MINUTE=0 \
          API_RATE_LIMIT_PER_MINUTE=0 \
          CORS_ALLOW_ORIGINS="http://localhost:3000" \
          CORS_ALLOW_CREDENTIALS=true \
          GOVERNMENT_FUNDING_SEED_PATH=configs/government-fundings/berlin.yaml \
          GOVERNMENT_FUNDING_SEED_STATE=berlin \
          ./bin/kitamanager-api > /tmp/kitamanager-api.log 2>&1 &
          API_PID=$!
          # Wait for API to be ready with retry loop
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process died"
              # Its output goes to a file now, so print it here or a startup
              # failure would be less legible than it was before the redirect.
              cat /tmp/kitamanager-api.log || true
              exit 1
            fi
            # Try the health check
            if curl -sf http://localhost:8080/api/v1/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 1
          done
          echo "API failed to start - checking what's listening on 8080:"
          ss -tlnp | grep 8080 || echo "Nothing on 8080"
          echo "Process status:"
          ps aux | grep kitamanager || echo "No kitamanager process"
          exit 1

      - name: Start Next.js server
        run: |
          cd frontend && npm run build && npm run start &
          # Wait for Next.js to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js is ready"
              break
            fi
            echo "Waiting for Next.js... ($i/30)"
            sleep 1
          done

      - name: Run E2E tests
        # All three projects: chromium (1280px), tablet-chrome (768px) and
        # mobile-chrome (Pixel 7, 412px). The two device projects existed in
        # playwright.config.ts and had committed visual baselines, but this command
        # pinned --project=chromium, so they had never run here — which is how a
        # test that cannot pass below 1024px stayed green for months.
        #
        # Sharded across 6 instead of 2 because there are now three times as many
        # tests: same wall-clock gate, more runners.
        run: cd frontend && npx playwright test --shard=${{ matrix.shard }}/6
        env:
          BASE_URL: http://localhost:3000
          CI: true

      # What the API said, when a shard fails.
      #
      # It used to inherit the start step's stdout, and that step exits as soon
      # as the health check passes, so every request logged during the tests
      # went to a descriptor nobody reads. The job output contained no API lines
      # at all.
      #
      # That is not merely untidy: it makes a whole class of failure
      # undiagnosable. On 2026-08-29 an attendance test failed waiting for a
      # success toast, which means the API refused the update — and the reason
      # was gone. The client saw a missing element, the server's account of why
      # was discarded, and the shard's blob report expired before anyone looked.
      # The refusal could not be explained even in principle.
      #
      # Non-2xx first, because that is the line worth reading, then the tail for
      # context around it.
      - name: API server log
        if: ${{ failure() }}
        run: |
          echo "=== non-2xx responses ==="
          grep -E 'status=[45][0-9][0-9]' /tmp/kitamanager-api.log || echo "(none)"
          echo "=== last 300 lines ==="
          tail -n 300 /tmp/kitamanager-api.log || true

      # The shard's blob, which is an intermediate: the e2e-report job merges all
      # six into one HTML report. Kept briefly and only for that.
      #
      # Uploaded whether or not the shard passed. `if: failure()` meant a
      # *changed* visual baseline was only ever kept because the change also
      # failed the job, and a green shard discarded its rendered pages entirely.
      # The suite screenshots ten pages across three viewports on every run
      # (visual-regression.spec.ts); throwing that away on success is the whole
      # reason nobody looks at it.
      #
      # !cancelled() rather than always(): a cancelled shard leaves a truncated
      # blob, and merging one of those fails the report for every other shard.
      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      # Smoke-test the report-pdf tool against the same running stack the
      # E2E suite just exercised: verifies the print pages still render
      # end-to-end (login → cookie wiring → Playwright render → PDF write
      # → pdfcpu merge) and produces an artifact a reviewer can open to
      # eyeball regressions in chart layout that unit tests can't catch.
      # Reuses the seed admin credentials the API already booted with.
      #
      # We exercise the actual Dockerfile.report container — not just the
      # Go binary on the runner — because that's the artefact end users
      # consume, and CI testing only the binary on Ubuntu (which has all
      # of Chromium's shared libs already) hid the v0.29.0 release going
      # out with a wrong-Chromium-revision and a runtime base missing
      # libnss/libatk/etc. Building + running the image here means a
      # broken image fails CI instead of a cut release.
      #
      # Runs even when the E2E suite fails (`!cancelled()` rather than
      # `success()`) — that catches the case where the report renders
      # fine but a different E2E spec is flaky, and surfaces report-only
      # failures that would otherwise be invisible to the E2E job.
      # Run the report-pdf smoke-test only on shard 1 — every shard brings
      # up an identical stack, so generating the PDF on each one would
      # only duplicate work and create artifact-name collisions.
      - name: Set up Docker Buildx (for report image cache)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: docker/setup-buildx-action@v4

      - name: Build report-pdf image
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.report
          load: true
          tags: kitamanager-report:ci
          cache-from: type=gha,scope=report-ci
          cache-to: type=gha,mode=max,scope=report-ci

      - name: Generate PDF reports (via container)
        # !cancelled() rather than success(), on purpose: the PDFs are still
        # worth having when a test failed. But they cannot be produced when the
        # API never started, and attempting it then reports "login failed:
        # connection refused" -- which reads like the cause and is only the
        # consequence. Gate on the server actually being up.
        if: ${{ !cancelled() && matrix.shard == 1 && steps.api.outcome == 'success' }}
        run: |
          mkdir -p /tmp/report-pdfs
          # The non-root `node` user inside the container writes the
          # PDFs; the bind-mounted host dir needs to be world-writable
          # for that to succeed on the GitHub-hosted runner.
          chmod 777 /tmp/report-pdfs
          # --network host so the container can reach the API and
          # frontend running on the runner's localhost.
          docker run --network host --rm \
            -e KITAMANAGER_REPORT_EMAIL=superadmin@example.com \
            -e KITAMANAGER_REPORT_PASSWORD=supersecret \
            -e KITAMANAGER_REPORT_ORG_ID=1 \
            -e KITAMANAGER_REPORT_BASE_URL=http://localhost:3000 \
            -e KITAMANAGER_REPORT_API_URL=http://localhost:8080 \
            -e KITAMANAGER_REPORT_OUTPUT_DIR=/output \
            -v /tmp/report-pdfs:/output \
            kitamanager-report:ci

      - name: Upload generated report
        # Upload only the merged report (`report-{org}-{month}.pdf`) —
        # the four per-section PDFs in the same directory are intermediate
        # artefacts that pdf.MergeFiles already concatenates into the
        # combined file, so shipping them separately is just noise inside
        # the zip wrapper GitHub forces on every artifact.
        # always() (gated on shard 1) so we capture the merged file if it
        # was produced even when an earlier step (e.g., E2E) failed.
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: report-pdf
          path: /tmp/report-pdfs/report-*.pdf
          retention-days: 30
          if-no-files-found: ignore

  # One report for the whole run, and a comment pointing at it.
  #
  # Sharding six ways produced six artifacts, each a fragment: finding the
  # screenshots for one failing test meant working out which shard had run it and
  # downloading that zip. Playwright's blob reporter exists for exactly this --
  # each shard emits a blob, `merge-reports` stitches them into a single HTML
  # report carrying every screenshot, diff and trace, browsable as one page.
  #
  # The comment does not embed the images and cannot: artifacts are
  # authenticated zip downloads, GitHub markdown will not render them, and
  # `data:` URIs are stripped. What it can do is say whether any rendered page
  # moved and put the report one click away, which is the difference between
  # noticing and not -- from the PR alone, an intended redesign and an accidental
  # regression both look like a red "E2E Tests (shard 3/6)".
  e2e-report:
    name: E2E Report
    runs-on: ubuntu-latest
    # !cancelled() rather than success(): a failed shard is exactly when there is
    # something to look at.
    if: ${{ !cancelled() }}
    needs: [e2e]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: cd frontend && npm ci

      # continue-on-error: a cancelled or crashed shard may upload no blob, and
      # download-artifact treats a missing artifact as a failure. A partial
      # report beats none.
      - name: Download every shard's blob
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Merge into one report
        id: merge
        working-directory: frontend
        run: |
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "No blobs to merge."
            exit 0
          fi
          npx playwright merge-reports --reporter html ./all-blob-reports
          # A second pass for a machine-readable copy. The summary step needs the
          # attachment names, and those live *inside* the blob zips -- scanning
          # the blob directory for `*-diff.png` finds nothing, because every one
          # of them is a zip entry rather than a file on disk.
          npx playwright merge-reports --reporter json ./all-blob-reports > merged-report.json
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Upload the merged report
        if: ${{ steps.merge.outputs.merged == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Which rendered pages changed
        id: summary
        working-directory: frontend
        run: |
          # Playwright writes `<name>-diff.png` only when a screenshot comparison
          # fails, so the diff attachments are the list of pages that moved.
          #
          # Grepping names out of the JSON rather than walking its structure: the
          # attachment name and its path both end in the same filename, so
          # basename + sort -u collapses them, and a shape change in the report
          # cannot silently empty the list. The report link is the point of the
          # comment either way, so this degrades to "no diffs" rather than
          # failing the job.
          mapfile -t diffs < <(
            grep -oE '"[^"]*-diff\.png"' merged-report.json 2>/dev/null |
              tr -d '"' | xargs -r -n1 basename | sed 's/-diff\.png$//' | sort -u
          )
          {
            echo "changed<<EOF"
            printf '%s\n' "${diffs[@]}"
            echo "EOF"
            echo "count=${#diffs[@]}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          CHANGED: ${{ steps.summary.outputs.changed }}
          COUNT: ${{ steps.summary.outputs.count }}
          MERGED: ${{ steps.merge.outputs.merged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- e2e-report -->';
            const count = Number(process.env.COUNT || 0);
            const changed = (process.env.CHANGED || '').split('\n').filter(Boolean);
            const merged = process.env.MERGED === 'true';
            const link = `${process.env.RUN_URL}#artifacts`;

            const lines = [marker, '### Playwright report', ''];

            if (!merged) {
              lines.push('No report was produced — every shard was cancelled or crashed before writing one.');
            } else {
              lines.push(
                `[Download \`playwright-report\`](${link}) — all six shards merged into one page, with every screenshot, diff and trace.`,
                '',
                'Unzip and open `index.html`. GitHub cannot render artifact contents inline, so it arrives as a zip.',
                ''
              );
              if (count === 0) {
                lines.push('Every rendered page still matches its committed baseline.');
              } else {
                lines.push(
                  `${count} rendered ${count === 1 ? 'page has' : 'pages have'} changed:`,
                  '',
                  ...changed.map((n) => `- \`${n}\``),
                  '',
                  'If those are intended, refresh them with `npx playwright test --update-snapshots` and commit the result.'
                );
              }
            }

            const body = lines.join('\n');

            // Edit this run's comment rather than adding one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  swagger-docs:
    name: Swagger Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Generate swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          make swagger-docs

      - name: Check for uncommitted changes
        run: git diff --exit-code docs/

  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: peaceiris/actions-hugo@v3
        with:
          extended: true

      - name: Build website
        run: cd website && hugo --minify
