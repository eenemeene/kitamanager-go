version: 2

# Every ecosystem below carries a 7-day cooldown: Dependabot will not propose a
# release until it has been on the registry for a week. This repo has
# auto-merge enabled, so without it a freshly published malicious version can
# reach `main` unattended, gated only by the required checks — and those test
# behaviour, not provenance. A week is roughly the window in which the
# npm compromises of recent years were spotted and yanked.
#
# The cost is real and worth stating: this also delays Dependabot's
# *security* update PRs for these manifests, so a known CVE sits for up to a
# week longer. That is the trade — slower patching of known-bad in exchange
# for not auto-merging unknown-bad. Urgent CVEs can still be bumped by hand,
# which is faster than waiting for Dependabot either way.
#
# `default-days` is what every ecosystem here supports. gomod and npm also
# accept semver-major-days/semver-minor-days/semver-patch-days; they are left
# off deliberately, because a malicious release is just as likely to be shaped
# as a patch as a major, so splitting the window by bump type would weaken
# exactly the case this is for.
#
# Go modules are included even though the module proxy makes published versions
# immutable. Immutability defeats "publish good, later swap in bad"; it does
# nothing against "publish bad in the first place", which is the attack a
# cooldown addresses.
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps:"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(frontend):"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # eslint 10 breaks eslint-plugin-react (contextOrFilename.getFilename
      # is not a function). eslint-config-next@16.x still pins
      # eslint-plugin-react@7.37.x which only supports eslint<=9. Unpin once
      # eslint-plugin-react ships a release compatible with eslint 10.
      - dependency-name: eslint
        versions: [">=10"]
      # typescript 7 is the new native (Go) compiler; its npm package ships
      # platform-native binaries and drops the classic JS Compiler API, which
      # breaks openapi-typescript (make api-types-check: ts.factory undefined)
      # and `next build`. Unpin once openapi-typescript and Next.js support
      # the TS7 native compiler.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-plugin-react-hooks 7.1 turns on set-state-in-effect and a
      # stricter dependency-list shape check, which flag 9 pre-existing spots
      # (the two-factor dialogs, app-sidebar, forecast-optimize-tab,
      # use-problem-form-errors, attendance). They are real findings, not noise,
      # and fixing them means restructuring effects — a behavioural change that
      # belongs in its own pull request, not in a dependency bump. package.json
      # pins the plugin to 7.0.1 via `overrides` because it arrives transitively
      # through eslint-config-next. Drop both once those effects are fixed.
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1"]

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker:"
