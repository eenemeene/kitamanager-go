version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps:"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(frontend):"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # eslint 10 breaks eslint-plugin-react (contextOrFilename.getFilename
      # is not a function). eslint-config-next@16.x still pins
      # eslint-plugin-react@7.37.x which only supports eslint<=9. Unpin once
      # eslint-plugin-react ships a release compatible with eslint 10.
      - dependency-name: eslint
        versions: [">=10"]
      # msw 2.13.4 ships ESM source that Jest cannot parse without extra
      # transformIgnorePatterns config. Revisit when msw ships a CJS build
      # or when we migrate Jest to ESM.
      - dependency-name: msw
        versions: [">=2.13.4"]
      # typescript 7 is the new native (Go) compiler; its npm package ships
      # platform-native binaries and drops the classic JS Compiler API, which
      # breaks openapi-typescript (make api-types-check: ts.factory undefined)
      # and `next build`. Unpin once openapi-typescript and Next.js support
      # the TS7 native compiler.
      - dependency-name: typescript
        versions: [">=7"]

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker:"
