  /api/v1/organizations/{orgId}/employees/{employeeId}/contracts/{contractId}/amend:
    post:
      consumes:
      - application/json
      description: |-
        Record that the terms changed as of a date — a raise, a change in weekly hours, a
        move to another section. The addressed contract is closed the day before
        `effective_from` and a successor carrying the changes starts on it; both are returned.

        This is the operation to use for anything that affects pay, because it keeps the old
        terms on record for the months they applied to. `effective_from` is honoured,
        including in the past, and it anchors the pay-plan coverage check — the old path
        checked at today, which accepted a backdated amendment to a grade the plan only
        gained later, and rejected one it had at the time.

        Fields you omit inherit from the contract being amended. Send `to` as null to make
        the successor open-ended.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: integer
      - description: Employee ID
        in: path
        name: employeeId
        required: true
        type: integer
      - description: Contract ID
        in: path
        name: contractId
        required: true
        type: integer
      - description: Effective date and the terms that changed
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.EmployeeContractAmendRequest'
      - description: The contract's current version, quoted, e.g. \
        in: header
        name: If-Match
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.EmployeeContractAmendResponse'
        "400":
          description: effective_from not after the start, contract already ended
            before it, or grade/step not covered at that date
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "404":
          description: Contract not found
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "409":
          description: The successor would overlap another contract (contract_overlap)
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "412":
          description: The contract was changed by someone else since you read it
            (precondition_failed) — reload and reapply
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "428":
          description: If-Match header missing (precondition_required)
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
