host: localhost:8080
info:
  contact:
    email: support@kitamanager.example.com
    name: API Support
  description: |-
    REST API for a Kita management system: children and their care
    contracts, employees and theirs, sections, attendance, and the
    Berlin ISBJ funding and billing model. Organization-scoped
    throughout, with role-based access control.

    ## Authentication

    Sessions are server-side. `POST /api/v1/login` sets two cookies: an
    HttpOnly `session` cookie holding the session token, and a
    JS-readable `csrf_token`. The token is opaque — not a JWT — and is
    hashed before it is stored, so a leaked database row is not a usable
    credential.

    A request presents that session in one of two ways:

    - **Browser** — the `session` cookie, sent automatically. Every
    mutating request (POST, PATCH, PUT, DELETE) must also echo the
    `csrf_token` cookie back in the `X-CSRF-Token` header, or it is
    rejected. Reads do not need it.
    - **CLI or server-to-server** — `Authorization: Bearer <token>` with
    the same value the login response put in the cookie. CSRF does not
    apply here, because a browser never attaches this header on its own.

    There is no refresh endpoint: a session stays valid until logout,
    expiry, or revocation via `/api/v1/me/sessions`.

    ## Concurrency

    Contract writes are guarded with optimistic concurrency. Every
    contract response carries a `version`, and `GET` of a single contract
    also returns it as an `ETag`. Corrections, amendments, end-date
    changes and deletes require that value in an `If-Match` header;
    omitting it is `428`, and a stale value is `412`. The seam-move
    endpoint takes both contracts' versions in its body instead, because
    it addresses two resources at once.
