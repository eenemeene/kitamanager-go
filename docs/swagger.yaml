      school_entry_date:
        description: |-
          Opt rather than *time.Time, unlike its neighbours above: a reversed
          Zurückstellung has to be expressible, and `*T` collapses "left the field
          alone" into "set it to null" -- so a plain pointer could record a deferral
          and never undo one.
        example: "2028-08-01"
        format: date-time
        type: string
        x-nullable: true
