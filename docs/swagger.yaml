  /api/v1/organizations/{orgId}/children/{childId}/contracts/{contractId}/end:
    post:
      consumes:
      - application/json
      description: |-
        Record that a contract stops on a date — a child leaving — or undo that by sending
        `to` as null, which makes it ongoing again.

        `to` is required in the body. The old surface could only reopen a contract by
        *omitting* the field, which was indistinguishable from "leave it alone"; here the
        null is explicit.

        Reopening a contract that has a successor is a 409, not a silent overwrite.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: integer
      - description: Child ID
        in: path
        name: childId
        required: true
        type: integer
      - description: Contract ID
        in: path
        name: contractId
        required: true
        type: integer
      - description: The end date, or null to reopen
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ContractEndRequest'
      - description: The contract's current version, quoted, e.g. \
        in: header
        name: If-Match
        required: true
        type: string
