  /api/v1/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate with email and password. If the user has
        no MFA factor, returns `{status:"authenticated"}` and
        sets the session cookie. If the user has an active
        factor, returns `{status:"mfa_required", pending_token,
        expires_at, factors}` and the caller must follow up
        with POST /auth/mfa/verify. No cookie is set on the
        MFA branch.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'MFA required: no cookie set; follow up with POST /auth/mfa/verify'
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.LoginMFARequiredResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
      summary: 'Login user (step 1: password)'
      tags:
      - auth
  /api/v1/logout:
    post:
      description: |-
        Delete the current session and clear authentication cookies.
        Works for both transports: the `session` cookie and
        `Authorization: Bearer`. Idempotent — logging out an already
        expired session succeeds. Returns 500 if the session could not
        be revoked, so a client is never told it is logged out while
        its credential is still valid.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
      summary: Logout user
      tags:
      - auth
