securityDefinitions:
  BearerAuth:
    description: |-
      `Bearer <token>` where the token is the opaque session value returned
      by login — not a JWT. Intended for CLI and server-to-server callers;
      CSRF does not apply to it.
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: |-
      Session cookie set by `POST /api/v1/login`, sent automatically by
      browsers. Mutating requests must additionally send the CSRF header
      below. This is what the web frontend uses.
    in: cookie
    name: session
    type: apiKey
  CsrfToken:
    description: |-
      Required on every mutating request made with `CookieAuth`. Its value
      is the `csrf_token` cookie, which login sets alongside the session
      cookie and which is deliberately readable from JavaScript so the
      client can copy it into this header. Requests authenticated with
      `BearerAuth` do not need it.
    in: header
    name: X-CSRF-Token
    type: apiKey
swagger: "2.0"
