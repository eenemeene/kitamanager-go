      security:
      - BearerAuth: []
      summary: List the caller's active sessions
      tags:
      - auth
  /api/v1/me/sessions/{sessionId}:
    delete:
      description: |-
        Deletes the session with the given id (sha256 hex of the
        cookie value). Scoped to the caller — a user cannot revoke
        another user's session, and the response is 404 in that
        case so the endpoint does not leak session existence. If
        the caller revokes their own current session, their next
        request will 401 and the frontend will clear cookies.
      parameters:
      - description: Session id (sha256 hex)
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_eenemeene_kitamanager-go_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke one of the caller's own sessions
      tags:
      - auth
