repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # Bumped from the 500 KB default so the OpenAPI 3.0 spec
        # (docs/openapi.json, ~700 KB) and the swaggo swagger.json
        # artefact can be committed. They're checked-in so PR diffs
        # show the actual API contract changes.
        args: ['--maxkb=1024']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.11.4
    hooks:
      - id: golangci-lint

  - repo: local
    hooks:
      # === Fast checks first (seconds) ===
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: make api-build
        language: system
        types: [go]
        pass_filenames: false

      - id: swagger-check
        name: swagger docs check
        entry: bash -c 'go install github.com/swaggo/swag/cmd/swag@latest && make swagger-docs && git diff --exit-code docs/'
        language: system
        types: [go]
        pass_filenames: false

      - id: web-type-check
        name: web type check
        entry: bash -c 'cd frontend && npm run type-check'
        language: system
        files: ^frontend/.*\.(tsx?|jsx?)$
        pass_filenames: false

      - id: web-lint
        name: web eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(tsx?|jsx?)$
        pass_filenames: false

      - id: web-format-check
        name: web prettier check
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        files: ^frontend/.*\.(tsx?|jsx?|css|json)$
        pass_filenames: false

      # === Slow checks (minutes) ===
      # -p 1 runs package test binaries one at a time. Each DB-backed
      # package spins up its own Postgres testcontainer (testutil), so the
      # default per-CPU parallelism starts many containers at once and
      # flakes on resource exhaustion (`connection refused` mid-run),
      # compounded by -race's memory overhead. Serializing trades wall time
      # for a single live container and a deterministic run.
      - id: go-test
        name: go test
        entry: go test -race -p 1 ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-integration-test
        name: go integration test
        entry: go test -tags=integration ./internal/integration/...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-contract-test
        name: go contract test
        entry: go test -tags=contract ./internal/contract/...
        language: system
        types: [go]
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck $(go list ./... | grep -v internal/testutil)'
        language: system
        types: [go]
        pass_filenames: false

      # gosec finds AST-level security issues — hardcoded creds, weak
      # crypto, unsafe file/path handling, unchecked errors on security-
      # relevant calls. Complements govulncheck (CVE scanning) and
      # golangci-lint (general lint). False positives get a #nosec line
      # with an explicit justification, same shape as the existing
      # annotations in internal/seed and internal/importer.
      - id: gosec
        name: gosec
        entry: bash -c 'go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./...'
        language: system
        types: [go]
        pass_filenames: false

      - id: web-test
        name: web unit tests with coverage
        entry: bash -c 'cd frontend && npx jest --coverage'
        language: system
        files: ^frontend/.*\.(tsx?|jsx?)$
        pass_filenames: false

      - id: website-build
        name: website hugo build
        entry: bash -c 'cd website && hugo --minify'
        language: system
        files: ^website/
        pass_filenames: false

      - id: website-htmltest
        name: website htmltest
        entry: bash -c 'command -v htmltest >/dev/null || go install github.com/wjdp/htmltest@latest && cd website && hugo --quiet && htmltest'
        language: system
        files: ^website/
        pass_filenames: false

      # Mirrors the lychee step in .github/workflows/website.yml so PRs
      # cannot land with broken internal links. The script tries the
      # native binary, then `cargo install`, then podman/docker — so
      # contributors don't need a Rust toolchain just to run pre-commit.
      - id: website-lychee
        name: website lychee link check
        entry: website/scripts/lychee-check.sh
        language: system
        files: ^website/
        pass_filenames: false
