baseURL: https://kitamanager.example.org/
title: KitaManager
theme: hextra

defaultContentLanguage: en
defaultContentLanguageInSubdir: true

enableRobotsTXT: true
enableGitInfo: true

languages:
  en:
    languageName: English
    weight: 1
    contentDir: content/en
    params:
      description: Modern kindergarten management software built with Go and Next.js
    menu:
      main:
        - identifier: documentation
          name: Documentation
          pageRef: /docs/
          weight: 1
        - identifier: features
          name: Features
          pageRef: /features/
          weight: 2
        - identifier: screenshots
          name: Screenshots
          pageRef: /screenshots/
          weight: 3

  de:
    languageName: Deutsch
    weight: 2
    contentDir: content/de
    params:
      description: Moderne Kita-Verwaltungssoftware mit Go und Next.js
    menu:
      main:
        - identifier: documentation
          name: Dokumentation
          pageRef: /docs/
          weight: 1
        - identifier: features
          name: Funktionen
          pageRef: /features/
          weight: 2
        - identifier: screenshots
          name: Bildschirmfotos
          pageRef: /screenshots/
          weight: 3

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 28
      height: 28

  page:
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Hugo 0.158+ tightened the default security.http.urls policy, which
# now blocks all remote URL fetches unless explicitly whitelisted. The
# Hextra theme uses resources.GetRemote at build time to pull FlexSearch
# (search index) and Mermaid (diagram rendering) from jsdelivr; without
# this allow-list the build fails with "access denied: ... is not
# whitelisted in policy security.http.urls".
security:
  http:
    urls:
      - ^https://cdn\.jsdelivr\.net/.*
