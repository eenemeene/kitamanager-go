# Local development stack.
#
# Requires a .env file in the repo root:
#
#   cp .env.dev.example .env
#   docker compose up -d
#
# The API container reads every config value from .env, except DB_HOST which is
# overridden here to the in-network service name ("db"). The Postgres container
# reuses DB_USER / DB_PASSWORD / DB_NAME from the same .env via substitution so
# there is exactly one source of truth.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Inside the compose network, the DB hostname is the service name, not
      # whatever is in .env (which is typically localhost for running the
      # binary directly).
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER is required — copy .env.dev.example to .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required — copy .env.dev.example to .env}
      - POSTGRES_DB=${DB_NAME:?DB_NAME is required — copy .env.dev.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
