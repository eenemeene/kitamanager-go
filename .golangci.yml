version: "2"
linters:
  enable:
    - forbidigo
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam
  settings:
    forbidigo:
      forbid:
        - pattern: 'c\.JSON\(http\.StatusNoContent'
          msg: "Use c.Status(http.StatusNoContent) instead of c.JSON(http.StatusNoContent, ...) — 204 must not have a body"
    gosec:
      excludes:
        - G104
        - G117
        - G706
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
    paths:
      # Some npm packages ship Go sources next to their JavaScript (e.g.
      # flatted, pulled in transitively by eslint). They carry no go.mod of
      # their own, so `./...` treats them as part of this module and lints
      # third-party code. CI never hits this because the API lint job does
      # not install frontend deps, but `make ci` does — so exclude them.
      - frontend/node_modules
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/eenemeene/kitamanager-go
  exclusions:
    generated: lax
    paths:
      # Same rationale as the linters exclusion above; without this gofmt and
      # goimports flag the vendored-by-npm Go sources too.
      - frontend/node_modules
      - third_party$
      - builtin$
      - examples$
